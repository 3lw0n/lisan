# إعدادات بناء مضبوطة لتبقى البيئة مستجيبة أثناء التطوير والاختبار.
# ٣ عمّال من ٨ أنوية (٣٧٪) وسقف ذاكرة ٣ ج.ب: المقيس إجمالًا ٥٢٪ متوسطًا و٦١٪ ذروة،
# وكان قبلها بلا حدّ للعمّال وبذاكرة ٨ ج.ب فيسحب الجهاز بالكامل.
org.gradle.workers.max=3
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
